services:
  caddy:
    container_name: caddy
    image: lucaslorentz/caddy-docker-proxy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CADDY_INGRESS_NETWORKS=caddy_network
      - ACME_AGREE=true
    labels:
      caddy.email: kfreitag@kieran.ca
      caddy_1: home.kfreitag.ca
      caddy_1.reverse_proxy: host.docker.internal:8123
      caddy_0: (tinyauth_forwarder)
      caddy_0.forward_auth: tinyauth:3000
      caddy_0.forward_auth.uri: /api/auth/caddy
    networks:
      - caddy_network

  tinyauth:
    container_name: tinyauth
    image: ghcr.io/steveiliop56/tinyauth:v5
    restart: unless-stopped
    environment:
      - TINYAUTH_EXPERIMENTAL_CONFIGFILE=/config.yaml
      - TINYAUTH_APPURL=https://auth.kfreitag.ca
      - TINYAUTH_PROVIDERS_POCKETID_CLIENTID=bac2503d-7cc1-4f87-9985-20a3bff67eb1
      - TINYAUTH_PROVIDERS_POCKETID_CLIENTSECRETFILE=/run/secrets/admin-apps-oidc-client-secret
      - TINYAUTH_PROVIDERS_POCKETID_AUTHURL=https://id.kfreitag.ca/authorize
      - TINYAUTH_PROVIDERS_POCKETID_TOKENURL=https://id.kfreitag.ca/api/oidc/token
      - TINYAUTH_PROVIDERS_POCKETID_USERINFOURL=https://id.kfreitag.ca/api/oidc/userinfo
      - TINYAUTH_PROVIDERS_POCKETID_REDIRECTURL=https://auth.kfreitag.ca/api/oauth/callback/pocketid
      - TINYAUTH_PROVIDERS_POCKETID_SCOPES=openid email profile groups
      - TINYAUTH_PROVIDERS_POCKETID_NAME=RhodhouseID
    volumes:
      - ./tinyauth.yaml:/config.yaml:ro
      - /run/agenix/admin-apps-oidc-client-secret:/run/secrets/admin-apps-oidc-client-secret:ro
    networks:
      - caddy_network
    labels:
      caddy: auth.kfreitag.ca
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  caddy_network:
    external: true
