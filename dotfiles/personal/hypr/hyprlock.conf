$font = Liberation Sans

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/wallpapers/cat_wallpaper.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_family = $font
    font_size = 26
    color = rgba(255, 255, 255, 0.9)
    position = 0, -60
    halign = center
    valign = top
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 100
    color = rgb(255, 255, 255)
    position = 0, -100
    halign = center
    valign = top
}

label {
    monitor =
    text = $DESC
    font_family = $font
    font_size = 22
    color = rgba(255, 255, 255, 0.9)
    position = 0, 140
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 260, 44
    position = 0, 80
    halign = center
    valign = bottom
    rounding = 10
    outline_thickness = 1
    dots_center = true
    dots_size = 0.22
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = Enter Password
    font_family = $font

    inner_color = rgba(0, 0, 0, 0.3)
    outer_color = rgba(255, 255, 255, 0.4)
    check_color = rgba(255, 255, 255, 0.7)
    fail_color = rgb(255, 105, 97)
    font_color = rgb(255, 255, 255)
    capslock_color = rgb(255, 214, 102)
}
