services:
    profilarr:
        image: ghcr.io/dictionarry-hub/profilarr:develop
        container_name: profilarr
        environment:
            - PUID=1000
            - PGID=1000
            - UMASK=022
            - TZ=America/Vancouver
            - ORIGIN=https://profiles.kfreitag.ca
            - OIDC_DISCOVERY_URL=https://id.kfreitag.ca/.well-known/openid-configuration
            - OIDC_CLIENT_ID=3c006749-171b-4203-9a18-dc07e37754dd
            - PARSER_HOST=parser
            - PARSER_PORT=5000
        entrypoint:
            - /bin/sh
            - -c
            - |
                export OIDC_CLIENT_SECRET="$$(cat /run/secrets/profilarr-oidc-client-secret)"
                exec /sbin/tini -- /entrypoint.sh
        volumes:
            - ./config:/config
            - /run/agenix/profilarr-oidc-client-secret:/run/secrets/profilarr-oidc-client-secret:ro
        restart: always
        depends_on:
            parser:
                condition: service_healthy
        labels:
            caddy: profiles.kfreitag.ca
            caddy.reverse_proxy: "{{upstreams 6868}}"
            homepage.group: Automation
            homepage.name: Profilarr
            homepage.href: profiles.kfreitag.ca
        networks:
            - default
            - caddy_network

    parser:
        image: ghcr.io/dictionarry-hub/profilarr-parser:latest
        container_name: profilarr-parser
        restart: always

networks:
    caddy_network:
        external: true