services:
    hoser-shop-admin:
        image: hoser-shop-admin:latest
        restart: always
        networks:
            - caddy_network
        environment:
            SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:?required}
            SHOPIFY_API_SECRET_FILE: /run/secrets/hoser-shop-api-secret
            SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:?required}
            SCOPES: ${SCOPES:-read_products,write_products,read_files}
        volumes:
            - ./data:/data
            - ${SHOPIFY_API_SECRET_FILE:?required}:/run/secrets/hoser-shop-api-secret:ro
        labels:
            caddy: ${APP_DOMAIN:?required}
            caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
    caddy_network:
        external: true
