services:
    dockhand:
        image: fnsys/dockhand:latest
        container_name: dockhand
        restart: always
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./data:/app/data
        networks:
            - caddy_network
        labels:
            caddy: containers.kfreitag.ca
            caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
    caddy_network:
        external: true
