services:
  norish:
    container_name: norish
    image: docker.io/norishapp/norish:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/uploads
      - /run/agenix/norish-oidc-client-secret:/run/secrets/norish-oidc-client-secret:ro
      - /run/agenix/openrouter-api-key:/run/secrets/openrouter-api-key:ro
    environment:
      TZ: America/Vancouver
      AUTH_URL: https://recipes.kfreitag.ca
      DATABASE_URL: postgres://postgres:norish@db:5432/norish
      REDIS_URL: redis://redis:6379
      OBSCURA_ENDPOINT: ws://127.0.0.1:9222
      PASSWORD_AUTH_ENABLED: "false"
      OIDC_NAME: Rhodhouse ID
      OIDC_ISSUER: https://id.kfreitag.ca
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?required}
      AI_ENABLED: "true"
      AI_PROVIDER: generic-openai
      AI_ENDPOINT: https://openrouter.ai/api/v1
      AI_MODEL: "~deepseek/deepseek-flash-latest"
    command:
      - sh
      - -c
      - |
        export OIDC_CLIENT_SECRET="$$(cat /run/secrets/norish-oidc-client-secret)"
        export MASTER_KEY="$$OIDC_CLIENT_SECRET"
        export AI_API_KEY="$$(cat /run/secrets/openrouter-api-key)"
        exec node --import tsx /app/apps/web/server/index.ts
    healthcheck:
      test: [ "CMD-SHELL", 'node -e "require(''http'').get(''http://localhost:3000/api/v1/health'', r => process.exit(r.statusCode===200?0:1))"' ]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 1m
    labels:
      caddy: recipes.kfreitag.ca
      caddy.reverse_proxy: "{{upstreams 3000}}"
      homepage.group: Productivity
      homepage.name: Norish
      homepage.href: recipes.kfreitag.ca
    networks:
      - default
      - caddy_network

  obscura:
    container_name: norish-obscura
    image: docker.io/norishapp/obscura:0.2.5-norish.1
    restart: always
    network_mode: "service:norish"
    entrypoint:
      - /obscura
      - serve
      - --host
      - 127.0.0.1
      - --port
      - "9222"
      - --stealth

  redis:
    container_name: norish-redis
    image: docker.io/library/redis:8
    restart: always
    volumes:
      - ./redis:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    container_name: norish-postgres
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: norish
      POSTGRES_DB: norish
    volumes:
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  caddy_network:
    external: true
